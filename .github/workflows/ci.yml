name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  quality:
    # Both OSes on every push: the determinism suite's byte-identity claims (LF artifacts,
    # seeded sampling) are only worth anything if Windows and Linux agree.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type-check (mypy, src + tests)
        run: uv run mypy src tests
      - name: Tests (keyless; no secrets exist in this repository)
        run: uv run pytest --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Build wheel
        run: |
          uv build
          ls -la dist/
      - name: Install the wheel into a clean venv and run the consumer-contract tests
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl pytest
          cd /tmp && /tmp/clean/bin/python -c "import clinevals; print('clinevals', clinevals.__version__)"
          /tmp/clean/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_consumer_contract.py" -q -p no:cacheprovider -o addopts="" --rootdir=/tmp
      - name: Guard — no data files tracked
        run: |
          if git ls-files | grep -E '\.(csv|tsv|parquet|db|duckdb|sqlite|sqlite3|json\.gz)$'; then
            echo "::error::Data files are committed"; exit 1
          fi
          echo "OK"
