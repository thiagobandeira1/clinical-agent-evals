[project]
name = "clinical-agent-evals"
version = "0.1.0"
description = "Reusable, keyless-CI-first evaluation harness for clinical LLM agents: labeled datasets, deterministic scorers, injected LLM judges, stamped artifacts, ratchet gates, human spot-checks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thiago Bandeira", email = "thiagobatistanb@gmail.com" }]
dependencies = [
    "langchain-core>=0.3",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinevals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
# UP046/UP047: module-level TypeVars are part of the public API (ItemT is exported), so
# PEP 695 inline type parameters would remove a documented name.
ignore = ["S101", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["clinevals"]
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=clinevals --cov-report=term-missing"
markers = ["llm: needs a real model key (auto-skipped in CI)"]

[tool.coverage.run]
source = ["src/clinevals"]
